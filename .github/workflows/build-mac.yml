name: Build macOS app (.dmg)

# Chỉ build khi bấm "Run workflow" trên GitHub (Actions → Build macOS app (.dmg)),
# hoặc khi đẩy tag phát hành v*. Push code thường không build .dmg.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Ký ad-hoc (identity "-" trong package.json), không cần tài khoản Apple Developer.
      - run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: Heatmap-macOS
          path: dist/*.dmg
          if-no-files-found: error
