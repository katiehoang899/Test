<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heatmap</title>
  <link rel="icon" href="/__et/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/__et/style.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/__et/"><img src="/__et/logo.svg" alt="" width="32" height="32"><span>Heatmap</span></a>
    <div class="header-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="vi">VI</button>
      </div>
    </div>
  </header>

  <div class="container wide">
    <h1 data-i18n="scn.title"></h1>
    <p class="muted" data-i18n="scn.intro"></p>

    <div class="stat-tiles" id="tiles"></div>

    <div class="card">
      <div class="sessions-head">
        <form id="createForm" class="row" style="gap: 6px; flex-wrap: nowrap; flex: 1 1 360px">
          <input type="text" id="createName" maxlength="120" data-i18n-placeholder="ppl.new_scenario_placeholder" data-i18n-aria="home.new_scenario">
          <button type="submit" class="primary" data-i18n="home.create"></button>
        </form>
        <input type="search" id="search" class="scn-search" data-i18n-placeholder="scn.search" data-i18n-aria="scn.search">
      </div>
      <p class="small form-error" id="createError" role="alert"></p>
      <div style="overflow-x: auto">
        <table class="sessions-table scn-table">
          <thead>
            <tr>
              <th data-i18n="home.scenario"></th>
              <th class="num" data-i18n="scn.col_sessions"></th>
              <th data-i18n="scn.col_people"></th>
              <th data-i18n="scn.col_options"></th>
              <th data-i18n="scn.col_created"></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"><tr><td colspan="6" class="muted" data-i18n="common.loading"></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/__et/i18n.js"></script>
  <script src="/__et/account.js"></script>
  <script src="/__et/nav.js"></script>
  <script src="/__et/scenarios.js"></script>
</body>
</html>
